<text x="672.0" y="737.6" class="small" text-anchor="start">배시넷 바닥 실측 후 재단</text>
<text x="400.0" y="766.4" class="cap2" text-anchor="start">주기 (NOTES)</text>
<text x="400.0" y="784.0" class="note" text-anchor="start">1. 소재: 자작합판 4.0mm BB급↑, 결 방향=장변(450) 필수(해석 전제). 레이저 kerf 0.1~0.2 보정.</text>
<text x="400.0" y="801.6" class="note" text-anchor="start">2. 조립: 완전 접착 밀폐 — E0급 목공본드 전둘레 + 체결블록⑥ 8개소 M3×25 관통볼트(0.8N·m). 밀폐 후 AS 불가.</text>
<text x="400.0" y="819.2" class="note" text-anchor="start">3. 익사이터 4개 VHB로 [상판 안쪽면] 지정 위치 부착 → 배선 직렬 16Ω/채널, 후면 노치로 인출.</text>
<text x="400.0" y="836.8" class="note" text-anchor="start">4. 마감: 방수 실링 + 어린이제품 유해물질 기준(E0/E1) 도료. 외곽 모서리 R3 이상 + 사포.</text>
<text x="400.0" y="854.4" class="note" text-anchor="start">5. 검수: 총높이 20.0±0.3 · 15kg 중앙 정적 휨 ≤2.3mm · 익사이터 치수 실측 확인(9.55* vs 9.85 상충).</text>
<text x="400.0" y="872.0" class="note" text-anchor="start">6. EVA 보더⑨는 배시넷 바닥 내치수 실측 후 별도 도면 (조리원 카트 720×390 기준 예상).</text>
