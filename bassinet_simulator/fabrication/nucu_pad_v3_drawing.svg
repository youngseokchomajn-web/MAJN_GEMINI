<text x="668.8" y="790.4" class="small" text-anchor="start">×-</text>
<text x="707.2" y="790.4" class="small" text-anchor="start">배시넷 바닥 실측 후 재단</text>
<text x="400.0" y="819.2" class="cap2" text-anchor="start">주기 (NOTES)</text>
<text x="400.0" y="836.8" class="note" text-anchor="start">1. 소재: 자작합판 4.0mm BB급↑ · SE0/E0(포름알데히드 저방출) 명시. 그레인=장변 방향 필수(해석 전제+측판 파손 방지).</text>
<text x="400.0" y="854.4" class="note" text-anchor="start">2. 조립: 상판·측판·블록 = 타이트본드III 완전접착(무타공). 하판 = 무본드, #4×12 목나사 6점(AS 분리형). 코너 나사 7mm 인셋(블록 빗변 회피).</text>
<text x="400.0" y="872.0" class="note" text-anchor="start">3. 삼각 코너블록 12×12 빗변=R20 아크 현과 일치(기하 정확 백킹) — 12mm 전체 충전 + 상단 플러시 접착 필수.</text>
<text x="400.0" y="889.6" class="note" text-anchor="start">4. 익사이터는 공장 자착 9473PC(0.26mm)로 부착 — ⚠4941(1.1mm) 별도구매 금지(바터밍 여유 잠식+전달 손실). 직렬 16Ω, 좌측판 ⌀5.5 인출+그로밋.</text>
<text x="400.0" y="907.2" class="note" text-anchor="start">5. 마감: 수성 폴리우레탄(무독성/저VOC) 외부 코팅 + 식품등급 실란트(상판 둘레·배선홀). 조립 후 세로 모서리 후가공 라운드.</text>
<text x="400.0" y="924.8" class="note" text-anchor="start">6. 검수: 총높이 20.0±0.3 · 15kg 중앙 정적 휨 ≤2.3mm · 하판 나사 체결 후 래틀 없음(프로토콜 G6).</text>
<text x="400.0" y="942.4" class="note" text-anchor="start">7. 레이저 kerf 0.1~0.2mm 보정. 블록·보스는 자투리 아닌 정식 수량 품목(누락 금지).</text>
</g>
</svg>