            const getBabyDDayDetails = () => {
                if (!babyInfo) return null;
                const birth = new Date(babyInfo.birthDate);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                birth.setHours(0, 0, 0, 0);
                const diff = today.getTime() - birth.getTime();
                
                if (diff < 0) {
                  const diffDays = Math.ceil(Math.abs(diff) / (1000 * 60 * 60 * 24));
                  return {
                    isBorn: false,
                    text: `출산 예정일 D-${diffDays}`,
                    ddayValue: -diffDays,
                    correctedDays: 0
                  };
                } else {
                  const diffDays = Math.floor(diff / (1000 * 60 * 60 * 24)) + 1;
                  let correctedDays = diffDays;
                  if (babyInfo.isPremature && babyInfo.gestationalWeeks && babyInfo.gestationalWeeks < 40) {
                    const missingWeeks = 40 - babyInfo.gestationalWeeks;
                    correctedDays = diffDays - (missingWeeks * 7);
                  }
                  return {
                    isBorn: true,
                    text: `생후 ${diffDays}일차`,
                    ddayValue: diffDays,
                    correctedDays: correctedDays > 0 ? correctedDays : 1

                                            <li>해열제를 복용시켜도 38.5도 이상의 고열이 24시간 이상 가라앉지 않고, 아기가 축 처지는 경우 즉시 내원하세요.</li>
                                        </ul>
                                    </div>

                                    <div className="border border-gray-150 p-4 rounded-2xl flex items-center justify-between text-xs font-semibold text-gray-700 bg-stone-50">
                                        <div className="flex items-center space-x-2">
                                            <Icon name="phone" className="w-4 h-4 text-indigo-600" />
                                            <span>정신건강 및 보건복지 상담 핫라인</span>
                                        </div>
                                        <div className="space-y-0.5 text-right text-indigo-650 font-bold">
                                            <p>1577-0199 (위기상담)</p>
                                            <p className="text-gray-900">129 (보건복지)</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-8 border-t border-gray-100 pt-5 text-center">
                                    <button 
                                        onClick={() => setIsEmergencyOpen(false)}
                                        className="px-8 py-3 bg-black hover:bg-gray-900 text-white font-bold rounded-xl text-sm transition-all"
                                    >
                                        확인 및 닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bottom Sheet 로그인 모달 */}
                    {isLoginOpen && (
                        <div className="fixed inset-0 z-[100] flex flex-col justify-end">
                            <div 
                                className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity"
                                onClick={() => setIsLoginOpen(false)}
                            ></div>
                            
                            <div className="relative bg-white rounded-t-3xl p-6 md:p-8 w-full max-w-md mx-auto shadow-2xl animate-in slide-in-from-bottom-full duration-300">
                                <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
                                
                                <button 
                                    onClick={() => setIsLoginOpen(false)}
                                    className="absolute top-5 right-5 p-2 rounded-full hover:bg-gray-100"
                                >
                                    <Icon name="x" className="w-6 h-6 text-gray-400" />
                                </button>

                                <h2 className="text-2xl font-extrabold text-gray-900 mb-2">마중 시작하기</h2>
                                <p className="text-gray-500 text-sm mb-8 font-medium">3초만에 가입하고 우리 아이 맞춤 정보를 받아보세요.</p>

                                <div className="space-y-3 font-sans">
                                    <button 
                                        onClick={() => handleSocialLogin("Kakao")}
                                        className="w-full flex items-center justify-center bg-[#FEE500] hover:bg-[#F4DC00] text-[#191919] font-bold py-3.5 rounded-xl transition-colors"
                                    >
                                        <Icon name="message-circle" className="w-5 h-5 mr-2 fill-current" />
                                        카카오로 시작하기
                                    </button>
                                    
                                    <button 
                                        onClick={() => handleSocialLogin("Naver")}
                                        className="w-full flex items-center justify-center bg-[#03C75A] hover:bg-[#02B350] text-white font-bold py-3.5 rounded-xl transition-colors"
                                    >
                                        <span className="font-black text-lg mr-2">N</span>
                                        네이버로 시작하기
                                    </button>

                                    <button 
                                        onClick={() => handleSocialLogin("Google")}
                                        className="w-full flex items-center justify-center bg-white hover:bg-gray-50 text-gray-800 border border-gray-200 font-bold py-3.5 rounded-xl transition-colors"
                                    >
                                        <span className="font-black text-lg mr-2 text-blue-500">G</span>
                                        구글로 시작하기
                                    </button>

                                    <button 
                                        onClick={() => handleSocialLogin("Apple")}
                                        className="w-full flex items-center justify-center bg-black hover:bg-gray-900 text-white font-bold py-3.5 rounded-xl transition-colors"
                                    >
                                        <span className="font-black text-lg mr-2"></span>
                                        애플로 시작하기
                                    </button>
                                </div>
                                
                                <p className="text-xs text-center text-gray-400 mt-6 font-medium font-sans">
                                    로그인 시 마중의 <span className="underline">이용약관</span> 및 <span className="underline">개인정보처리방침</span>에 동의하게 됩니다.
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
