            const [isEmergencyOpen, setIsEmergencyOpen] = useState(false);
            const [babyInfo, setBabyInfo] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [selectedSubCategory, setSelectedSubCategory] = useState("전체");

            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [userEmail, setUserEmail] = useState("");
            const [loginProvider, setLoginProvider] = useState("");

            const [name, setName] = useState("");
            const [birthDate, setBirthDate] = useState("");
            const [isPremature, setIsPremature] = useState(false);
            const [gestationalWeeks, setGestationalWeeks] = useState(37);

            useEffect(() => {
                const stored = localStorage.getItem("majn_baby_info");
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        setBabyInfo(parsed);
                        setName(parsed.name);
                        setBirthDate(parsed.birthDate);
                        setIsPremature(parsed.isPremature || false);
                        setGestationalWeeks(parsed.gestationalWeeks || 37);
                    } catch (e) {
                        console.error(e);
                    }
                }

                const loggedIn = localStorage.getItem("majn_logged_in") === "true";
                setIsLoggedIn(loggedIn);
                if (loggedIn) {
                    setUserEmail(localStorage.getItem("majn_user_email") || "");
                    setLoginProvider(localStorage.getItem("majn_login_provider") || "");
                }
            }, []);

            const handleNavigate = (type, milestone = '', article = '') => {
                window.scrollTo({ top: 0, behavior: 'instant' });
                setSelectedSubCategory("전체"); 
                setView({ type, milestone, article });
            };

            const handleSaveOnboarding = (e) => {
                e.preventDefault();
                if (!birthDate) return;
                
                const info = {
                    name: name.trim() || "아기",
                    birthDate,
                    isPremature,
                    gestationalWeeks: isPremature ? gestationalWeeks : undefined
                };
                
                localStorage.setItem("majn_baby_info", JSON.stringify(info));
                setBabyInfo(info);
                setIsEditing(false);
            };

            const handleResetBabyInfo = () => {
                localStorage.removeItem("majn_baby_info");
                setBabyInfo(null);
                setName("");
                setBirthDate("");
                setIsPremature(false);
                setGestationalWeeks(37);
            };

            const handleLogout = () => {
                localStorage.removeItem("majn_logged_in");
                localStorage.removeItem("majn_user_email");
                localStorage.removeItem("majn_login_provider");
                setIsLoggedIn(false);
                setUserEmail("");
                setLoginProvider("");
            };

            const handleSocialLogin = (provider) => {
                localStorage.setItem("majn_logged_in", "true");
                localStorage.setItem("majn_user_email", "youngseok.cho@gmail.com");
                localStorage.setItem("majn_login_provider", provider);
                
                setIsLoggedIn(true);
                setUserEmail("youngseok.cho@gmail.com");
                setLoginProvider(provider);
                setIsLoginOpen(false);
            };

            const getBabyDDayDetails = () => {
                if (!babyInfo) return null;
                const birth = new Date(babyInfo.birthDate);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                birth.setHours(0, 0, 0, 0);
                const diff = today.getTime() - birth.getTime();
                
                if (diff < 0) {
                  const diffDays = Math.ceil(Math.abs(diff) / (1000 * 60 * 60 * 24));
                  return {
                    isBorn: false,
                    text: `출산 예정일 D-${diffDays}`,
                    ddayValue: -diffDays,
                    correctedDays: 0
                  };
                } else {
                  const diffDays = Math.floor(diff / (1000 * 60 * 60 * 24)) + 1;
                  let correctedDays = diffDays;
                  if (babyInfo.isPremature && babyInfo.gestationalWeeks && babyInfo.gestationalWeeks < 40) {
                    const missingWeeks = 40 - babyInfo.gestationalWeeks;
                    correctedDays = diffDays - (missingWeeks * 7);
                  }
                  return {
                    isBorn: true,
                    text: `생후 ${diffDays}일차`,
                    ddayValue: diffDays,
                    correctedDays: correctedDays > 0 ? correctedDays : 1
                  };
                }
            };

            const ddayDetails = getBabyDDayDetails();

            const renderOnboardingWidget = () => (

                                </div>

                                                <h5 className="font-serif font-bold text-gray-800 group-hover:text-indigo-600 transition-colors">
                                                    {recommendedArticle.title}
                                                </h5>
                                            </div>
                                            <Icon name="chevron-right" className="w-5 h-5 text-gray-400 group-hover:translate-x-0.5 group-hover:text-indigo-600 transition-all flex-shrink-0 ml-4" />
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* 우측 1개 열 - Sticky Onboarding 위젯 블록 (모바일 최상단 배치) */}
                            <div className="lg:col-span-1 mt-10 lg:mt-24 order-1 lg:order-2">
                                <div className="lg:sticky lg:top-24">
                                    {renderOnboardingWidget()}
                                </div>
                            </div>

                        </div>

                        {/* Sticky Bottom CTA */}
                        <div className="fixed bottom-0 left-0 w-full z-[45] px-6 py-4 bg-gradient-to-t from-white via-white to-transparent flex justify-center">
                            <button 
                                onClick={handleCtaClick}
                                className="w-full max-w-md bg-black hover:bg-gray-900 text-white py-4 rounded-2xl text-base font-extrabold shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all font-sans"
                            >
                                {ctaLabel}
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen">
                    {/* 라우팅 뷰 교체 */}
                    {view.type === 'landing' && renderLanding()}
                    {view.type === 'milestone' && renderMilestone()}
                    {view.type === 'article' && renderArticle()}

                    {/* 상시 노출 '응급처치 & 안전' 팝업 모달 */}
                    {isEmergencyOpen && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center px-4">
                            <div 
                                className="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity"
                                onClick={() => setIsEmergencyOpen(false)}
                            ></div>
                            
                            <div className="relative bg-white rounded-3xl p-6 md:p-8 w-full max-w-lg shadow-2xl max-h-[80vh] overflow-y-auto animate-in zoom-in-95 duration-200 text-left font-sans">
                                <div className="flex justify-between items-center border-b border-gray-100 pb-4 mb-6">
                                    <div className="flex items-center space-x-2 text-red-600">
                                        <Icon name="alert-triangle" className="w-6 h-6 text-red-600 animate-pulse" />
                                        <h2 className="text-xl font-bold text-gray-900 font-serif">마중 응급처치 & 안전 가이드</h2>
                                    </div>
                                    <button 
                                        onClick={() => setIsEmergencyOpen(false)}
                                        className="p-1.5 rounded-full hover:bg-gray-100"
                                    >
                                        <Icon name="x" className="w-5 h-5 text-gray-400" />
                                    </button>
                                </div>

                                <div className="space-y-6">
                                    <div className="bg-red-50/60 border border-red-100 p-5 rounded-2xl">
                                        <h3 className="font-bold text-red-955 flex items-center text-sm mb-2">영아 기도폐쇄 대처법 (만 1세 미만 하임리히법)</h3>
                                        <ol className="text-xs text-red-900 space-y-1.5 list-decimal pl-4 leading-relaxed font-semibold">
                                            <li>아기의 얼굴이 아래를 향하도록 허벅지 위에 비스듬히 엎드립니다. (머리를 가슴보다 낮게 위치)</li>
                                            <li>손바닥 밑부분으로 아기 양쪽 어깨뼈 사이(등)의 중앙을 <strong>세게 5회</strong> 내리칩니다.</li>
                                            <li>아기를 뒤집어 하늘을 보게 한 뒤, 양쪽 젖꼭지 중간선을 손가락 2개로 <strong>세게 5회</strong> 압박합니다.</li>
                                            <li>음식물이나 이물질이 나올 때까지 <strong>등 두드리기 5회와 가슴 압박 5회</strong>를 반복 수행합니다.</li>
                                        </ol>
                                    </div>

                                    <div className="bg-amber-50/60 border border-amber-100 p-5 rounded-2xl">
                                        <h3 className="font-bold text-amber-955 flex items-center text-sm mb-2">갑작스러운 열성경련 발생 시 행동 수칙</h3>
                                        <ul className="text-xs text-amber-900 space-y-1.5 list-disc pl-4 leading-relaxed font-semibold">
                                            <li><strong>절대 흔들거나 억지로 깨우지 마세요.</strong> (기도를 압박하거나 2차 흡인을 유발할 수 있습니다.)</li>
                                            <li>아기를 평평하고 단단한 바닥에 옆으로 눕혀 침이나 구토물이 기도로 넘어가지 않게 해주세요.</li>
                                            <li>경련하는 동안 입안에 물을 넣거나 약을 복용시키는 행위는 절대 엄금합니다.</li>
                                            <li>경련이 5분 이상 지속되면 즉시 119에 신고하세요.</li>
                                        </ul>
                                    </div>

                                    <div className="bg-sky-50/60 border border-sky-100 p-5 rounded-2xl">
                                        <h3 className="font-bold text-sky-955 flex items-center text-sm mb-2">접종 후 열성 이상 반응 및 응급실 방문 시기</h3>
                                        <ul className="text-xs text-sky-900 space-y-1.5 list-disc pl-4 leading-relaxed font-semibold">
                                            <li>생후 3개월 미만의 신생아가 38도 이상의 고열이 나는 경우 즉시 병원/응급실로 가야 합니다.</li>
                                            <li>해열제를 복용시켜도 38.5도 이상의 고열이 24시간 이상 가라앉지 않고, 아기가 축 처지는 경우 즉시 내원하세요.</li>
                                        </ul>
                                    </div>

                                    <div className="border border-gray-150 p-4 rounded-2xl flex items-center justify-between text-xs font-semibold text-gray-700 bg-stone-50">
                                        <div className="flex items-center space-x-2">
                                            <Icon name="phone" className="w-4 h-4 text-indigo-600" />
                                            <span>정신건강 및 보건복지 상담 핫라인</span>
                                        </div>
                                        <div className="space-y-0.5 text-right text-indigo-650 font-bold">
                                            <p>1577-0199 (위기상담)</p>
                                            <p className="text-gray-900">129 (보건복지)</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-8 border-t border-gray-100 pt-5 text-center">
                                    <button 
                                        onClick={() => setIsEmergencyOpen(false)}
                                        className="px-8 py-3 bg-black hover:bg-gray-900 text-white font-bold rounded-xl text-sm transition-all"
                                    >
                                        확인 및 닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bottom Sheet 로그인 모달 */}
                    {isLoginOpen && (
                        <div className="fixed inset-0 z-[100] flex flex-col justify-end">
                            <div 
                                className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity"
                                onClick={() => setIsLoginOpen(false)}
                            ></div>
                            
                            <div className="relative bg-white rounded-t-3xl p-6 md:p-8 w-full max-w-md mx-auto shadow-2xl animate-in slide-in-from-bottom-full duration-300">
                                <div className="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
                                
                                <button 
                                    onClick={() => setIsLoginOpen(false)}
                                    className="absolute top-5 right-5 p-2 rounded-full hover:bg-gray-100"
                                >
                                    <Icon name="x" className="w-6 h-6 text-gray-400" />
                                </button>

                                <h2 className="text-2xl font-extrabold text-gray-900 mb-2">마중 시작하기</h2>
                                <p className="text-gray-500 text-sm mb-8 font-medium">3초만에 가입하고 우리 아이 맞춤 정보를 받아보세요.</p>

                                <div className="space-y-3 font-sans">
                                    <button 
                                        onClick={() => handleSocialLogin("Kakao")}
                                        className="w-full flex items-center justify-center bg-[#FEE500] hover:bg-[#F4DC00] text-[#191919] font-bold py-3.5 rounded-xl transition-colors"
                                    >
                                        <Icon name="message-circle" className="w-5 h-5 mr-2 fill-current" />
                                        카카오로 시작하기
                                    </button>
                                    
                                    <button 
                                        onClick={() => handleSocialLogin("Naver")}
                                        className="w-full flex items-center justify-center bg-[#03C75A] hover:bg-[#02B350] text-white font-bold py-3.5 rounded-xl transition-colors"
                                    >
                                        <span className="font-black text-lg mr-2">N</span>
                                        네이버로 시작하기
                                    </button>

                                    <button 
                                        onClick={() => handleSocialLogin("Google")}
                                        className="w-full flex items-center justify-center bg-white hover:bg-gray-50 text-gray-800 border border-gray-200 font-bold py-3.5 rounded-xl transition-colors"
                                    >
                                        <span className="font-black text-lg mr-2 text-blue-500">G</span>
                                        구글로 시작하기
                                    </button>

                                    <button 
                                        onClick={() => handleSocialLogin("Apple")}
                                        className="w-full flex items-center justify-center bg-black hover:bg-gray-900 text-white font-bold py-3.5 rounded-xl transition-colors"
                                    >
                                        <span className="font-black text-lg mr-2"></span>
                                        애플로 시작하기
                                    </button>
                                </div>
                                
                                <p className="text-xs text-center text-gray-400 mt-6 font-medium font-sans">
                                    로그인 시 마중의 <span className="underline">이용약관</span> 및 <span className="underline">개인정보처리방침</span>에 동의하게 됩니다.
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
