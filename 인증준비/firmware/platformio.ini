[platformio]
default_envs = esp32_wifi_phone

[env:esp32_wifi_phone]
platform = espressif32
board = esp32dev
board_build.partitions = partitions_8mb_ota.csv
board_upload.flash_size = 8MB
framework = arduino
monitor_speed = 115200
build_flags = 
    -DMAJN_FULL_HW=1
    -DMAJN_WIFI_CONTROL=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:esp32_wifi_phone_txtest]
platform = espressif32
board = esp32dev
board_build.partitions = partitions_8mb_ota.csv
board_upload.flash_size = 8MB
framework = arduino
monitor_speed = 115200
build_flags = 
    -DMAJN_FULL_HW=1
    -DMAJN_WIFI_CONTROL=1
    -DMAJN_WIFI_TX_DBM=19
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:esp32_full_hw]
platform = espressif32
board = esp32dev
board_build.partitions = partitions_8mb_ota.csv
board_upload.flash_size = 8MB
framework = arduino
monitor_speed = 115200
build_flags = 
    -DMAJN_FULL_HW=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:esp32_ble_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -DMAJN_BLE_ONLY_TEST=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
