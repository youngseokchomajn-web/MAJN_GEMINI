power_and_audio:
  ldo_regulator: "AP2112K-3.3TRG1 (LCSC C51118, SOT-23-5, 600mA)"
  boost_converter:
    ic: "MP3426DL-LF-Z (LCSC C133224, QFN-14)"
    feedback_divider:
      R1_high_side: "143 kΩ (0603 1%, LCSC C22877)"
      R2_low_side: "16 kΩ (0603 1%, LCSC C22818 / C4210)"
      vref_nominal: 1.225
      theoretical_vout: 12.17 # V
      measured_vout: 12.00 # V
  audio_amplifier:
    ic: "TAS5805MPWPR (LCSC C478472, TSSOP-28)"
    mode: "BTL Differential"
    i2c_address: "0x2C (ADR pull-up R12=4.7kΩ to 3V3)"
    firmware_amplitude_clamp: "0.5f (50% max in vibration_controller.cpp#L70-L71; digital PCM software scaling of -6.02 dBFS, not analog voltage clamp)"
    boot_register_master_vol: "0x30 (0 dB unity gain written in tas5805m.cpp#L62; gCurrentVolume=72 in amplifier_manager.cpp is in RAM only and not written to register at boot)"
    power_output_model:
      status: "CALCULATED_ESTIMATE (measured power UNVERIFIED)"
      notes: "0.75W and 1.125W are hypothetical calculation examples assuming an ideal 6.0V peak sine wave. Real output depends on TAS5805M DSP, PWM modulation limits, PVDD ripple, and frequency-dependent complex impedance. Actual BTL differential voltage and RMS power require oscilloscope differential probe measurement."
      ideal_square_wave_average_power_ceiling:
        notes: "Theoretical average load power if ideal +/-12V bipolar square wave were continuously applied (Vrms = 12.0V). Not peak instantaneous power."
        p_avg_24ohm: 6.0 # W (12.0^2 / 24)
        p_avg_16ohm: 9.0 # W (12.0^2 / 16)
      ideal_full_scale_sine_average_power:
        v_peak: 12.0 # V
        v_rms: 8.485 # Vrms (12.0 / sqrt(2))
        p_avg_24ohm: 3.0 # W (8.485^2 / 24)
        p_avg_16ohm: 4.5 # W (8.485^2 / 16)
      hypothetical_clamped_sine_calculation_example:
        notes: "Calculation example assuming a clean 6.0V peak sine wave (Vrms = 4.24V) is applied across load. Not actual firmware output power."
        v_peak_assumed: 6.0 # V (12V * 0.5 sine assumption)
        v_rms_assumed: 4.243 # Vrms (6.0 / sqrt(2))
        p_avg_24ohm: 0.75 # W (4.243^2 / 24)
        p_avg_16ohm: 1.125 # W (4.243^2 / 16)
      measured_btl_power: "UNVERIFIED (oscilloscope differential probe and current probe measurement pending)"

