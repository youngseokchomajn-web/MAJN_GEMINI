housing:
  type: "4.5T Birch Plywood enclosure (Rev 2 DXF 10-bolt; Decision 10 6-bolt conflict pending resolution)"
  dimensions_mm: [450.0, 250.0, 22.5]
  cavity_depth_mm: 13.5
  coordinate_system:
    global_z_mm: [0.0, 22.5] # Bottom plate [0.0, 4.5], Cavity [4.5, 18.0], Top plate [18.0, 22.5]
    cavity_z_mm: [0.0, 13.5] # Cavity floor at 0.0mm, Cavity ceiling at 13.5mm
  master_dxf: "majn_housing/majung_bassinet_4.5T_rev2_master.dxf"
  pcb_mount_method: "Double-sided adhesive foam tape (no bottom plate holes; ECO-001 Rev 7 evaluates Alt A under 23-mode FMEA with decoupled top/bottom tests; Alt B causes 14.1mm cavity collision; Alt C excluded from testing as CONCEPT_ONLY; physical coupon testing required)"
  fastener_engagement_audit:
    status: "EVALUATION_IN_PROGRESS (ECO-001 Rev 7 Failure Modes & Test Plan Aligned)"
    alternative_a:
      bottom_bolt: "M2.5x7mm countersunk (2.5mm engagement in brass = 1.0d)"
      top_bolt: "M2.5x4mm pan head with washer (1.9mm engagement in brass = 0.76d)"
      fmea_status: "23 potential failure modes identified (FM-BOT-01~10, FM-TOP-01~07, FM-PCB-01~06) in ENG_001_006_ROUND7_FAILURE_MODE_AND_TEST_PLAN.md; top thread shear and bottom wood crushing decoupled into separate tests"
      defect: "Top engagement is 0.76d (~2.7 active load-bearing threads after ISO 4753 chamfer), below tentative 1.0d screening criterion; cyclic vibration risk under 30~65Hz; UNACCEPTABLE_WITHOUT_TEST"
    alternative_b:
      standoff: "Würth Elektronik WA-SBRII 970070154 (M2.5 x 7.0mm, brass Ni-plated, through-threaded)"
      internal_clearance: "Bottom bolt 8mm (3.5mm entry) + top bolt 5mm (2.9mm entry) = 6.4mm inside 7.0mm standoff (0.6mm nominal clearance, marginal under tolerances)"
      defect: "Total stackup 7.0mm + 1.6mm PCB + 5.5mm inductor = 14.1mm > 13.5mm cavity depth; causes +0.6mm direct mechanical interference with vibrating plate; REQUIRES_HOUSING_CAVITY_REDESIGN"
    alternative_c:
      concept: "Threaded wood insert in bottom plate + M2.5 male-female standoff"
      defect: "No standard commercial off-the-shelf M2.5 wood inserts for 4.5T plywood identified in survey (RAMPA wood starts at M4; E-Z LOK wood starts at M3; Kerb-Konus Ensat 302 length is 6.0mm > 4.5mm plate); EXCLUDED_FROM_TESTING / CONCEPT_ONLY"
    physical_verification_requirement: "Birch plywood 4.5T test coupons (8EA decoupled matrix: G-1 Bottom 3EA, G-2 Vibration/Top 3EA, G-3 Reference 2EA; N=3 limited to early screening) torque/vibration/pull-out validation (T0-CP-BOT-01, T0-CP-TOP-01, T0-VIB-01) required prior to design freeze"
    load_mechanics_basis:
      pcb_assembly_mass_g: 30.0
      transport_shock_30g_n: 8.83
      cable_pull_force_status: "25N unverified assumption; load path shows >90% absorbed by grommet; 75N requirement re-classified as PROVISIONAL_CALCULATED_ESTIMATE / TBD"
      pull_out_formal_pass_criterion: "TBD (measured system external force x SF >= 2.0 <= coupon failure load)"
      vibration_duration_phase1: "2.0 hours (2.0G, 30~65Hz swept-sine, 53 cycles, ACC-1~3 decoupled)"
  grounding_architecture:
    type: "PCB Signal/Power GND pad contact (no metal chassis present in birch plywood housing; Chassis GND expression eliminated)"
    forensic_evidence: "Gerber GBL D10 5.0mm copper pad and GBS 5.01mm opening at MH1~MH4; FlyingProbe PTH 106.3 mil on NET GND; USB-C shield pins directly connected to NET GND"
    measurement_architecture:
      overall_path_resistance: "Standoff body to USB-C shell total path (R_path,total)"
      interface_contact_resistance: "Standoff top face to PCB bottom pad pure contact (R_contact,interface)"
    qc_continuity_procedure:
      primary_qc: "Standard 2-wire DMM buzzer continuity test and loop resistance < 1.0 ohm across 4 standoff pads and USB-C shield pad"
      secondary_engineering: "4-wire Kelvin micro-ohmmeter measurement for joint contact resistance characterization; formal threshold baseline TBD pending coupon measurements"
  clearance_analysis:
    nominal_static_clearance_mm: 1.4 # static calculation (13.5mm cavity - 12.1mm stackup)
    pcb_asymmetry_offset_mm: [1.27, 0.127] # X-axis offset +1.27mm relative to symmetrical hole pattern (PCB outer bounds X in [184.36, 268.18]mm, margin 184.36mm left vs 181.82mm right)
    rough_scaling_deflection_estimate_mm: 0.35 # rough isotropic scaling reference from 600x340 4.0T data; unverified for orthotropic birch plywood and actual boundary conditions
    dynamic_clearance_status: "VERIFICATION_PENDING (1.05mm cannot be declared safe dynamic clearance without CAE and physical testing)"
    clearance_verification_exit_criteria:
      - "CAE structural/modal simulation reflecting actual housing boundary conditions (resolving 6-bolt vs 10-bolt SSOT conflict) and orthotropic plywood properties"
      - "15kg distributed vs concentrated infant load deflection measurement"
      - "Physical prototype dynamic clearance measurement during 30~65Hz excitation (tentative design verification target >= 0.5mm for bottoming prevention)"

